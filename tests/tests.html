<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тесты верстака</title>
    <style>
        :root {
            --bg: #f7f5f0;
            --ink: #1d1d1f;
            --ok: #1e7b34;
            --bad: #b3261e;
            --line: #e2ded5;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #17181b;
                --ink: #ececef;
                --ok: #7bd88f;
                --bad: #ff8a80;
                --line: #33343a;
            }
        }

        :root[data-theme="dark"] {
            --bg: #17181b;
            --ink: #ececef;
            --ok: #7bd88f;
            --bad: #ff8a80;
            --line: #33343a;
        }

        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 8px;
        }

        #summary {
            font-weight: 700;
            margin: 8px 0 16px;
        }

        .ok {
            color: var(--ok);
        }

        .bad {
            color: var(--bad);
        }

        li {
            padding: 4px 0;
            border-bottom: 1px solid var(--line);
        }

        code {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
<h1>Тесты ядра верстака</h1>
<p>Открой эту страницу после любой правки в <code>js/core.js</code>. Всё зелёное — можно выкладывать.</p>
<div id="summary"></div>
<ol id="list"></ol>

<!-- Подключаем те же файлы, что и сама страница, кроме интерфейса -->
<script src="../js/data.js"></script>
<script src="../js/core.js"></script>
<script src="tests.js"></script>
</body>
</html>
